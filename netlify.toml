[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"


# Clean URLs: send old .html addresses (on any host, www included) straight to the
# non-www address without .html, so www + .html is a single 301

[[redirects]]
  from = "/about.html"
  to = "https://bringthebloombar.com/about"
  status = 301
  force = true

